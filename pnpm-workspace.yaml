packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  # Force a single @types/node so peer-resolved native tooling
  # (vitest, electron-rebuild) shares one ABI scope. Without this,
  # @types/better-sqlite3 pulls an unbounded 2nd @types/node, splitting
  # vitest into duplicate installs and breaking its root .bin link.
  '@types/node': ^22.5.0

blockExoticSubdeps: false

onlyBuiltDependencies:
  - electron
  - better-sqlite3
  - esbuild
  - protobufjs

allowBuilds:
  electron: true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
